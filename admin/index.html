<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Editor de conteúdo · SamGrowthLabs</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/style.css"></head><body>
<header class="admin-header"><div><span class="admin-badge">Editor local</span><h1>Conteúdo da SamGrowthLabs</h1><p>Edite os dados abaixo e baixe o arquivo atualizado. Nenhuma informação é enviada para um servidor.</p></div><a href="/" target="_blank">Abrir site ↗</a></header>
<main class="admin-shell">
<section class="admin-panel"><div class="panel-title"><div><span>01</span><h2>Informações da holding</h2></div></div><div class="form-grid"><label>Nome da holding<input id="company-name"></label><label>E-mail público<input id="company-email" type="email"></label><label>Ano de fundação<input id="company-year" type="number"></label><label class="full">Frase institucional<input id="company-tagline"></label><label class="full">Descrição<textarea id="company-description" rows="3"></textarea></label></div></section>
<section class="admin-panel"><div class="panel-title"><div><span>02</span><h2>Projetos</h2></div><button class="button secondary" id="add-project" type="button">+ Adicionar projeto</button></div><div id="project-list" class="project-editor-list"></div></section>
<section class="admin-actions"><div><strong>Como publicar</strong><p>Baixe o arquivo e substitua o <code>config.js</code> na pasta principal do site.</p></div><div class="action-buttons"><button class="button secondary" id="reset" type="button">Restaurar dados</button><button class="button secondary" id="save-draft" type="button">Salvar rascunho</button><button class="button primary" id="download" type="button">Baixar config.js</button></div></section><p class="notice" id="notice" role="status"></p>
</main><script src="/config.js"></script><script src="/admin/script.js"></script></body></html>
